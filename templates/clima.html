<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Clima</title>
  <link rel="stylesheet" href="../statics/styles.css" />
</head>
<body>
  <header class="sub-header">
    <h1>Clima</h1>
    <a class="btn small" href="index.html">Inicio</a>
  </header>

  <main class="container">
    <section class="api-card">
      <h2>Busca el clima por ciudad</h2>
      <form id="clima-form">
        <input type="text" id="ciudad" placeholder="Ej. Madrid" required />
        <button class="btn" type="submit">Buscar</button>
      </form>

      <div id="resultado-clima" class="resultado hidden">
        <img id="icono-clima" alt="icono clima" />
        <p><strong>Temperatura:</strong> <span id="temp"></span> °C</p>
        <p><strong>Humedad:</strong> <span id="humedad"></span> %</p>
        <p><strong>Descripcion:</strong> <span id="descripcion"></span></p>
      </div>
    </section>
  </main>

  <script src="../js/clima.js"></script>
</body>
</html>
